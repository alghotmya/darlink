version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ -d frontend ]; then cd frontend; fi && npm install
    build:
      commands:
        - if [ -d frontend ]; then cd frontend; fi && npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
