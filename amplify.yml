# AWS Amplify build spec (Hosting - Gen 1)
# Set env var in Amplify Console: VITE_API_BASE_URL = https://YOUR_API_ID.execute-api.REGION.amazonaws.com/prod/
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd $CODEBUILD_SRC_DIR/darlink/frontend && rm -rf node_modules && npm ci && npm install @rollup/rollup-linux-x64-gnu@4.57.1 --no-save
    build:
      commands:
        - cd $CODEBUILD_SRC_DIR/darlink/frontend && npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - "**/*"
  cache:
    paths: []
